 else h+='<p class=warn>Brak prognozy – czekam na pierwszy cykl (pobieranie historii może potrwać kilkanaście sekund).</p>';
 h+='</div>'+(m==13?rPlan():'')+'<div class=grid>'+[0,1,2,3,4].map(i=>`<div class=box><div class=row><select onchange="SEL[${m}][${i}]=this.value;zm(${m},${i},0)">${IV.map(v=>`<option value=${v} ${SEL[m][i]==v?'selected':''}>${IVL[v]}</option>`).join('')}</select><span><button title="Przybliż" onclick="zm(${m},${i},.8)">＋</button> <button title="Oddal" onclick="zm(${m},${i},1.25)">－</button> <button title="Reset" onclick="zm(${m},${i},0)">⟲</button></span></div><canvas id=cv${i}></canvas></div>`).join('')+'</div><small>Zoom: kółko myszy, szczypanie dwoma palcami lub przyciski; przeciąganie przesuwa wykres w przeszłość; dwuklik = reset. Pusta świeca = jeszcze niezamknięta.</small>';
 h+=`<div class="box sc"><table><tr><th>Horyzont<th>Kierunek<th>Zmiana<th>Cel<th>Przedział 80%<th>↑<th>→<th>↓<th>Test kroczący: n<th>przewaga Briera<th>trafność<th>Na żywo: n<th>trafność<th>Brier<th>pokrycie przedziału<th>Status</tr>`+H.map((x,k)=>{const f=LF[m][k],b=BT[m]&&BT[m][k],s=stats(m,x);if(!f)return`<tr><td>${hl(x)}<td colspan=15>–`;const d=dirOf(f);
  return`<tr><td>${hl(x)}<td class=${d[1]}>${d[0]}<td>${pct(f)}<td>${f.tg.toFixed(0)}<td>${f.lo.toFixed(0)}–${f.hi.toFixed(0)}<td>${pc(f.pu)}<td>${pc(f.pf)}<td>${pc(f.pd)}<td>${b?b.n:'–'}<td>${b&&b.n>=30?((1-b.b/b.bb)*100).toFixed(1)+'%':'–'}<td>${b&&b.n>=30?pc(b.acc):'–'}<td>${s?s.n:0}<td>${s?pc(s.acc):'–'}<td>${s?s.br.toFixed(3):'–'}<td>${s?pc(s.cov):'–'}<td>${flag(m,k)}`}).join('')+'</table><small>Horyzonty od ok. 1144 dni wzwyż (zwłaszcza 3333d i 5222d) nie mają dość historii do testu kroczącego – są oceniane dopiero po dojrzeniu. Horyzont 12h testowany wstecz na przybliżeniu 1-dniowym.</small></div>';
 const s=stats(m);h+=`<div class=box><b>Skuteczność na żywo (wszystkie horyzonty)</b>: ${s?`n=${s.n}, trafność ${pc(s.acc)}, Brier ${s.br.toFixed(4)}, błąd MAE ${s.mae.toFixed(2)} p.p., pokrycie przedziału 80% = ${pc(s.cov)}, średnie P(wzrost) ${pc(s.pu)} vs faktyczna częstość ${pc(s.fu)}${s.n>=60&&s.rec>s.br*1.2?' <span class=warn>⚠ ostatnie 30 ocen gorsze o ponad 20% – możliwa utrata skuteczności</span>':''}`:'brak ocenionych prognoz (pierwsze wyniki po 12 godzinach)'}</div>`;
 h+=`<div class=box><b>Wersje i uczenie</b><br>${S.versions.map(v=>`v${v.ver} g=${v.cfg.g} f=${v.cfg.f} – ${lt(v.t)} – ${v.why}`).join('<br>')}</div>`;
 h+=`<div class="box sc"><b>Historia prognoz (ostatnie 20, nigdy nie nadpisywane)</b><table><tr><th>Czas<th>Horyzont<th>Cena<th>Cel<th>Kierunek<th>Wynik</tr>`+FC.filter(f=>f.m==m).slice(-20).reverse().map(f=>{const r=RES.find(q=>q.k==f.k),d=dirOf(f);return`<tr><td>${lt(f.t)}<td>${hl(f.h)}<td>${f.P0.toFixed(0)}<td>${f.tg.toFixed(0)}<td class=${d[1]}>${d[0]}<td>${r?`${((Math.exp(r.r)-1)*100).toFixed(2)}% ${r.hit?'✔':'✘'}`:'oczekuje'}`}).join('')+'</table></div>';
 return h}
function rCmp(){let h='<h2>🆚 Porównanie modeli</h2><div class="box sc"><table><tr><th>Model'+H.map(x=>`<th>${hl(x)}`).join('')+'</tr>';
 M.forEach((x,m)=>{h+=`<tr><td>${x[0]} ${m+1}. ${x[1]}`+H.map((_,k)=>{const f=LF[m][k];if(!f)return'<td>–';const d=dirOf(f);return`<td class=${d[1]}>${d[0][0]} ${pct(f)}`}).join('')});
 h+='<tr><td><b>Rozbieżność</b>'+H.map((_,k)=>{let u=0,d=0;M.forEach((_,m)=>{const f=LF[m][k];if(!f)return;const x=dirOf(f)[1];if(x=='up')u++;if(x=='dn')d++});return`<td class=${u&&d?'warn':''}>${u&&d?`⚠ ${u}↑/${d}↓`:`${u}↑/${d}↓`}`}).join('')+'</table><small>▲ wzrost ▼ spadek ▶ bok. Nie pokazuję średniej prognoz – większa liczba modeli nie oznacza większej wiarygodności; sprzeczne kierunki są oznaczone ⚠.</small></div>';
 h+=`<div class="box sc"><b>Skuteczność dla horyzontu</b> ${hsel()}<table><tr><th>Model<th>Test kroczący: n<th>przewaga Briera nad bazowym<th>Na żywo: n<th>trafność<th>Brier<th>Status</tr>`+M.map((x,m)=>{const b=BT[m]&&BT[m][HS],s=stats(m,H[HS]);return`<tr><td>${x[0]} ${m+1}. ${x[1]}<td>${b?b.n:'–'}<td>${b&&b.n>=30?((1-b.b/b.bb)*100).toFixed(1)+'%':'–'}<td>${s?s.n:0}<td>${s?pc(s.acc):'–'}<td>${s?s.br.toFixed(3):'–'}<td>${flag(m,HS)}`}).join('')+'</table></div>';return h}
const IND=[['MVRV, NUPL, Realized Price, MVRV Z-Score','DOSTĘPNE – zastępnik darmowy','Coin Metrics Community API (CapMVRVCur); NUPL = 1 − 1/MVRV; z-score liczony kauzalnie, opóźnienie 1 dzień'],['SOPR (LTH/STH), HODL Waves, zmiana pozycji LTH','NIEDOSTĘPNE – zastąpione','płatne; zastępniki: NUPL, Fear & Greed, aktywne adresy'],['Netflow i rezerwy giełdowe','zależy od Coin Metrics','FlowInExUSD/FlowOutExUSD, jeśli publiczne (sprawdź status niżej); inaczej tylko wartość transferów'],['Puell Multiple','DOSTĘPNY (na żywo)','blockchain.info'],['Aktywne adresy, wartość transferów','DOSTĘPNE (pełna historia)','Coin Metrics'],['Fear & Greed','DOSTĘPNY (od 2018)','alternative.me'],['Arkusz zleceń, spread, premia Coinbase','DOSTĘPNE (na żywo)','Binance, Coinbase'],['Funding, OI, long/short','DOSTĘPNE (funding od 2019)','Binance Futures (blokowane w części krajów)'],['Implikowana zmienność DVOL','DOSTĘPNA (na żywo)','Deribit'],['DXY (koszyk USD)','DOSTĘPNY (informacyjnie)','Frankfurter/EBC, wagi DXY'],['Likwidacje, stopy procentowe, przepływy ETF','NIEDOSTĘPNE','brak darmowego API bez klucza z historią']];
function rLab(){const ok=v=>v?'<span class=up>OK</span>':'<span class=dn>brak</span>',e=EXT||{};
 let h=`<h2>🛠️ Laboratorium i status</h2><div class=box><b>Źródła (ostatni cykl)</b><br>Binance spot ${ok(SRC.spot)} · arkusz ${ok(SRC.depth)} · futures ${ok(SRC.fut)} · historia funding ${ok(SRC.fh)} · Coin Metrics ${ok(SRC.cm)} · netflow giełd ${ok(SRC.nf)} · Fear&Greed ${ok(SRC.fg)} · blockchain.info ${ok(SRC.chain)} · Coinbase ${ok(SRC.cb)} · Deribit ${ok(SRC.dv)} · kursy walut ${ok(SRC.fx)}<br><small>Ostatnie wartości: premia Coinbase ${e.prem!=null?(e.prem*1e4).toFixed(1)+' pb':'–'} · long/short ${e.ls!=null?e.ls.toFixed(2):'–'} · funding ${e.fund!=null?(e.fund*100).toFixed(4)+'%':'–'} · DVOL ${e.dvol!=null?e.dvol.toFixed(1):'–'} · USD (30d) ${e.dxy30!=null?e.dxy30.toFixed(2)+'%':'–'} · Puell ${e.puell!=null?e.puell.toFixed(2):'–'}</small></div>
 <div class=box>Ostatni cykl: ${CYC?lt(CYC):'–'} · następny: ${CYC?lt(CYC+CYCLE):'–'} · prognoz w bazie: ${FC.length} · ocen: ${RES.length}<br><button onclick="runCycle()">Uruchom cykl teraz</button> <button onclick="expo()">Eksport kopii (JSON)</button> <label class=mu>Import: <input type=file accept=.json onchange="impo(this.files[0])"></label> <button onclick="tests()">Uruchom testy</button></div><div id=tr class=box style="display:none"></div>`;
 h+='<div class="box sc"><b>Wskaźniki i źródła</b><table><tr><th>Wskaźnik<th>Status<th>Źródło</tr>'+IND.map(r=>`<tr><td>${r[0]}<td>${r[1]}<td>${r[2]}`).join('')+'</table></div>';
 h+=`<div class=box><b>Ograniczenia</b><br>• Całość działa w przeglądarce (GitHub Pages nie ma backendu): cykle zapisują się tylko przy otwartej karcie; pominięte cykle trafiają do dziennika jako opóźnienie.<br>• Dane w IndexedDB tej przeglądarki – rób eksport kopii.<br>• Pełny cykl zapisu co 24 min (14 modeli × 14 horyzontów: ${H.map(hl).join(', ')}); trening i selekcja co 12 h. Świece na wykresach odświeżają się co 5 min.<br>• Coin Metrics Community: licencja niekomercyjna, limit 10 zapytań / 6 s.</div>`;
 h+='<div class="box sc"><b>Dziennik</b><pre>'+LOGS.filter(l=>l.msg).slice(0,40).map(l=>lt(l.t)+'  '+l.msg).join('\n')+'</pre></div>';return h}
function render(){nav();document.getElementById('mn').innerHTML=TAB<14?rModel(TAB):TAB==14?rCmp():rLab();
 document.getElementById('st').textContent=CYC?`ostatnia aktualizacja ${lt(CYC)} · cykl 24 min`:'czekam na pierwszy cykl…';if(TAB<14){bindZ(TAB);charts(TAB)}}

async function expo(){const o={};for(const s of['models','fc','res','cyc','log'])o[s]=await all(s);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='btc-ai-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}

/* ---------- testy w przeglądarce ---------- */
async function tests(){const R=[],T=(n,c)=>R.push([n,!!c]);
 T('prawdopodobieństwa sumują się do 1',[-2,-.5,0,.7,3].every(m=>Math.abs(probs(m,.25).reduce((a,b)=>a+b)-1)<1e-9));
 T('Brier idealnej prognozy = 0',br([1,0,0],0)==0);
 const a=agg5d([0,1,2,3,4].map(i=>({t:i*D,o:10+i,h:20+i,l:1+i,c:15+i})),9e15)[0];T('agregacja 5d: O=pierwsze, H=max, L=min, C=ostatnie',a.o==10&&a.h==24&&a.l==1&&a.c==19&&a.cl);
 T('niezamknięta świeca 5d oznaczona',agg5d([{t:0,o:1,h:1,l:1,c:1}],D)[0].cl===false);
 T('zmiana % zgodna z ceną docelową',(f=>Math.abs(f.tg-f.P0*(1+(f.tg/f.P0-1)))<1e-6)({tg:105,P0:100}));
 const w=ridge([[1,0],[1,1],[1,2],[1,3]],[1,3,5,7],0);T('regresja ridge odtwarza prostą y=1+2x',Math.abs(w[0]-1)<.01&&Math.abs(w[1]-2)<.01);
 if(C.c.length>1000){const sv={...C},full=C.c.slice(),ft=C.t.slice(),cut=C.c.length-300;
  C={c:full.slice(0,cut),t:ft.slice(0,cut),cs1:[],cs2:[]};prep();const A=build(10,10,null).P.find(p=>p.i==1000);
  C={c:full,t:ft,cs1:[],cs2:[]};prep();const B=build(10,10,null).P.find(p=>p.i==1000);
  T('brak wycieku przyszłości: sygnały w punkcie 1000 identyczne bez ostatnich 300 dni',A&&B&&A.s.slice(0,14).every((v,i)=>Math.abs(v-B.s[i])<1e-9));}
 else R.push(['test wycieku wymaga załadowanych danych (uruchom cykl)',false]);
 try{await put('models',{k:'_test',v:1});await put('models',{k:'_test2',v:2});await put('models',{k:'_test',v:9});const r1=await get('models','_test'),r2=await get('models','_test2');T('zapis/odczyt i izolacja rekordów modeli',r1.v==9&&r2.v==2);await del('models','_test');await del('models','_test2')}catch(e){T('IndexedDB',0)}
 const c0=JSON.stringify(MS[1].cfg),sv=MS[0].cfg;MS[0].cfg={g:9,f:.9};T('zmiana parametrów modelu 1 nie zmienia modelu 2',JSON.stringify(MS[1].cfg)==c0);MS[0].cfg=sv;
 T('sprawdzanie dojrzałych prognoz: horyzont 0.5d → próg czasu',(t=>t+.5*D<=t+D)(0));
 T('14 modeli, każdy z sygnałem',DS[3]&&DS[3].P[DS[3].P.length-1].s.length==14&&M.length==14);
 const pl=lsPlan({pu:.6,pd:.25,pf:.15,mu:.02,sg:.1,P0:100});T('plan LONG: SL<wejście<TP1<TP2, prawdopodobieństwa w (0,1)',pl.d==1&&pl.sl<100&&pl.t1>100&&pl.t2>pl.t1&&pl.pOrd>0&&pl.pOrd<1&&pl.pT1>0&&pl.pT1<1);
 const ps=lsPlan({pu:.2,pd:.65,pf:.15,mu:-.02,sg:.1,P0:100});T('plan SHORT: TP<wejście<SL',ps.d==-1&&ps.t1<100&&ps.sl>100);
 T('interwał 1d dostępny, razem 10 interwałów',IV.includes('1d')&&IV.length==10);
 const el=document.getElementById('tr');el.style.display='block';el.innerHTML='<b>Wyniki testów</b><br>'+R.map(r=>`${r[1]?'<span class=up>✔</span>':'<span class=dn>✘</span>'} ${r[0]}`).join('<br>')}
/* ---------- start ---------- */
(async()=>{try{setTheme((()=>{try{return localStorage.getItem('btcTheme')}catch(e){}})()||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'));if(!(await get('log','v2')))await put('log',{k:'v2',t:Date.now(),msg:'Wersja 2: modele 1,2,3,5 używają nowych danych (MVRV, Fear&Greed, funding z historią); dodano model 14 AI LONG/SHORT.'});const ms=await all('models');MS=M.map((_,m)=>ms.find(r=>r.k=='m'+m)||{k:'m'+m,ver:1,cfg:{...DEF},versions:[{ver:1,cfg:{...DEF},t:Date.now(),why:'start'}],dep:0});
 FC=(await all('fc')).sort((a,b)=>a.t-b.t);RES=await all('res');LOGS=(await all('log')).sort((a,b)=>b.t-a.t);LASTTR=Math.max(0,...LOGS.filter(l=>l.k[0]=='t').map(l=>l.t));

 FC.forEach(f=>{const k=H.indexOf(f.h);if(k>=0)LF[f.m][k]=f});render();runCycle();setInterval(runCycle,CYCLE);setInterval(()=>{if(TAB<14)charts(TAB)},3e5)}
 catch(e){document.getElementById('mn').innerHTML='<p class=warn>Błąd inicjalizacji (IndexedDB niedostępne? tryb prywatny?): '+e.message+'</p>'}})();
