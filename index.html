 h+='<div class="box sc"><b>Historia decyzji (wdrożenia i odrzucenia)</b><pre>'+(window.__dec||[]).map(d=>lt3(d.t)+'  '+d.h+': '+d.dec).join('\n')+'</pre></div>';return h}

 const k='_t_'+Date.now(),r1={k,forecast_id:k};const n1=await addNew('meta',[r1]),n2=await addNew('meta',[{...r1,x:2}]);const g=await get('meta',k);await del('meta',k);T('baza: powtórny zapis tego samego klucza odrzucony (idempotencja)',n1==1&&n2==0&&g&&!g.x);
