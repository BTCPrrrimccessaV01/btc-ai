 try{if(CYC&&t-CYC>CYCLE*1.5)await lg(`Opóźnienie cyklu: ${Math.round((t-CYC)/6e4)} min (karta była nieaktywna)`);
  await loadDaily();const x=await extras(),N=C.c.length,px=C.c[N-1];
  if(t-C.t[N-1]>D+36e5)throw new Error('dane nieaktualne');
  DS=[];for(let k=0;k<H.length;k++){DS.push(build(Math.max(1,Math.round(H[k])),H[k],x));await sl()}
  BT=M.map((_,m)=>H.map((_,k)=>st(DS[k],m,MS[m].cfg)));
  const recs=[];M.forEach((_,m)=>H.forEach((h,k)=>{const f=mk(m,k,t,px);LF[m][k]=f;recs.push(f)}));
  await putMany('fc',recs);FC=FC.concat(recs);
  await put('cyc',{k:'c'+t,t,px,x,q:{...SRC},feat:DS[3].P[DS[3].P.length-1].f,n:recs.length});

 busy=false;render()}

async function kl(iv){const k=iv+Math.floor(Date.now()/6e4);if(KC[k])return KC[k];let r;
 if(iv=='5d'){const a=await jf('/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1000');r=agg5d(a.map(v=>({t:v[0],o:+v[1],h:+v[2],l:+v[3],c:+v[4]})),Date.now())}
 else{const a=await jf(`/api/v3/klines?symbol=BTCUSDT&interval=${iv}&limit=100`);r=a.map(v=>({t:v[0],o:+v[1],h:+v[2],l:+v[3],c:+v[4],cl:v[6]<Date.now()}))}
 KC[k]=r;return r}
function draw(cv,k,fc,hist){const dp=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dp;cv.height=h*dp;const g=cv.getContext('2d');g.scale(dp,dp);
 const cs=getComputedStyle(document.body),col=n=>cs.getPropertyValue(n).trim()||'#888',up=col('--g'),dn=col('--r'),mu=col('--m'),ac=col('--a');
 const v=k.slice(-70),R=96,pw=w-R-44,cw=pw/v.length;let lo=Math.min(...v.map(a=>a.l)),hi=Math.max(...v.map(a=>a.h));
 if(fc){lo=Math.min(lo,fc.tg);hi=Math.max(hi,fc.tg)}const pad=(hi-lo)*.06||1;lo-=pad;hi+=pad;const Y=p=>8+(hi-p)/(hi-lo)*(h-20);
 g.font='10px system-ui';g.fillStyle=mu;g.strokeStyle=col('--b');
 for(let i=0;i<5;i++){const p=lo+(hi-lo)*i/4;g.beginPath();g.moveTo(0,Y(p));g.lineTo(w-44,Y(p));g.stroke();g.fillText(p.toFixed(0),w-42,Y(p)+3)}
 v.forEach((a,i)=>{const x=i*cw+cw/2,c=a.c>=a.o?up:dn;g.strokeStyle=g.fillStyle=c;g.beginPath();g.moveTo(x,Y(a.h));g.lineTo(x,Y(a.l));g.stroke();
  const y1=Y(Math.max(a.o,a.c)),y2=Math.max(Y(Math.min(a.o,a.c)),y1+1);if(a.cl===false){g.fillStyle=col('--bg');g.fillRect(x-cw*.35,y1,cw*.7,y2-y1);g.strokeRect(x-cw*.35,y1,cw*.7,y2-y1)}else g.fillRect(x-cw*.35,y1,cw*.7,y2-y1)});
 const last=v[v.length-1],yc=Y(last.c);g.setLineDash([4,3]);g.strokeStyle=ac;g.beginPath();g.moveTo(0,yc);g.lineTo(w-44,yc);g.stroke();g.setLineDash([]);g.fillStyle=ac;g.fillText(last.c.toFixed(0),w-42,yc-3);
 const x0=pw+8;g.strokeStyle=mu;g.setLineDash([2,4]);g.beginPath();g.moveTo(x0,0);g.lineTo(x0,h);g.stroke();g.setLineDash([]);g.fillStyle=mu;g.fillText('prognoza',x0+4,10);
 (hist||[]).forEach(f=>{const i=v.findIndex(a=>a.t>=f.t);if(i<0)return;const r=RES.find(q=>q.k==f.k);g.fillStyle=r?(r.hit?up:dn):mu;g.beginPath();g.arc(i*cw+cw/2,Y(f.P0),3,0,7);g.fill()});
 if(fc){const c=fc.pu>fc.pd&&fc.pu>fc.pf?up:fc.pd>fc.pu&&fc.pd>fc.pf?dn:col('--y'),yt=Y(fc.tg);
  g.globalAlpha=.18;g.fillStyle=c;const yh=Math.max(0,Y(fc.hi)),yl=Math.min(h,Y(fc.lo));g.fillRect(x0+10,yh,R-20,yl-yh);g.globalAlpha=1;
  g.strokeStyle=c;g.setLineDash([5,3]);g.beginPath();g.moveTo(pw,yc);g.lineTo(x0+R-10,yt);g.stroke();g.setLineDash([]);
  g.fillStyle=c;g.fillText(((fc.tg/fc.P0-1)*100).toFixed(1)+'% ('+hl(fc.h)+')',x0+12,Math.max(22,Math.min(h-6,yt-4)));g.fillStyle=mu;g.fillText('cel '+fc.tg.toFixed(0),x0+12,Math.max(34,Math.min(h-16,yt+8)))}}
async function charts(m){const hk=H[HS],fc=LF[m][HS],hist=FC.filter(f=>f.m==m&&f.h==hk).slice(-150);
 for(let i=0;i<5;i++){const cv=document.getElementById('cv'+i);if(!cv)continue;try{draw(cv,await kl(SEL[TAB][i]),fc,hist)}catch(e){const g=cv.getContext('2d');cv.width=cv.clientWidth;g.fillStyle='#888';g.fillText('Brak danych wykresu: '+e.message,10,20)}}}

const IV=['1m','5m','15m','1h','4h','6h','12h','5d','1w'],IVL={'1m':'1 min','5m':'5 min','15m':'15 min','1h':'1 godz.','4h':'4 godz.','6h':'6 godz.','12h':'12 godz.','5d':'5 dni','1w':'1 tydz.'};
const dirOf=f=>f.pu>=f.pd&&f.pu>=f.pf?['▲ WZROST','up']:f.pd>f.pu&&f.pd>=f.pf?['▼ SPADEK','dn']:['■ STAGNACJA','fl'];
const pc=v=>(v*100).toFixed(1)+'%',pct=f=>((f.tg/f.P0-1)*100).toFixed(2)+'%',lt=t=>new Date(t).toLocaleString();
const bars=f=>`<div class=bar><i style="width:${f.pu*100}%;background:var(--g)"></i><i style="width:${f.pf*100}%;background:var(--y)"></i><i style="width:${f.pd*100}%;background:var(--r)"></i></div>`;
function nav(){document.getElementById('nav').innerHTML=M.map((x,i)=>`<button class="${TAB==i?'on':''}" onclick="TAB=${i};render()">${i+1}. ${x[0].split(' ').slice(0,2).join(' ')}</button>`).join('')+`<button class="${TAB==13?'on':''}" onclick="TAB=13;render()">Porównanie</button><button class="${TAB==14?'on':''}" onclick="TAB=14;render()">Lab / Status</button>`}
function flag(m,k){const b=BT[m]&&BT[m][k];if(m==9)return'punkt odniesienia';if(!HIST[m]&&m<5)return'tylko na żywo';if(!b||b.n<30)return'brak historii (niezweryfikowany)';const s=1-b.b/b.bb;return s>.01&&b.n>=60?'przewaga (walk-forward)':'eksperymentalny'}
function rModel(m){SEL[m]=SEL[m]||['1m','5m','15m','1h','4h'];const S=MS[m],fc=LF[m][HS];
 let h=`<h2>${m+1}. ${M[m][0]} <small>wersja ${S.ver} · g=${S.cfg.g} f=${S.cfg.f}</small></h2><div class=mu>${M[m][1]}</div>`;
 h+=`<div class=box>Horyzont na wykresach: <select onchange="HS=+this.value;render()">${H.map((x,i)=>`<option value=${i} ${i==HS?'selected':''}>${hl(x)}</option>`).join('')}</select> <button onclick="rb(${m})">Cofnij wersję</button>`;
 if(fc){const d=dirOf(fc),old=CYC&&Date.now()-fc.t>CYCLE*2;h+=`<h2 class=${d[1]}>${d[0]} ${pct(fc)} → ${fc.tg.toFixed(0)} USD</h2><div>Przedział 80%: ${fc.lo.toFixed(0)} – ${fc.hi.toFixed(0)} · wzrost ${pc(fc.pu)} · spadek ${pc(fc.pd)} · stagnacja ${pc(fc.pf)}</div>${bars(fc)}<small>Wygenerowano ${lt(fc.t)} z ceny ${fc.P0.toFixed(0)}; stagnacja = |zmiana| < ${fc.f}σ horyzontu. ${old?'<span class=warn>DANE NIEAKTUALNE</span>':''}</small>`}else h+='<p class=warn>Brak prognozy – czekam na pierwszy cykl.</p>';
 h+='</div><div class=grid>'+[0,1,2,3,4].map(i=>`<div class=box><select onchange="SEL[${m}][${i}]=this.value;charts(${m})">${IV.map(v=>`<option value=${v} ${SEL[m][i]==v?'selected':''}>${IVL[v]}</option>`).join('')}</select><canvas id=cv${i}></canvas></div>`).join('')+'</div>';
 h+=`<div class="box sc"><table><tr><th>Horyzont<th>Kierunek<th>Zmiana<th>Cel<th>Przedział 80%<th>↑<th>↓<th>■<th>WF n<th>WF Brier-skill<th>WF trafność<th>Live n<th>Live trafność<th>Live Brier<th>Pokrycie przedz.<th>Status</tr>`+H.map((x,k)=>{const f=LF[m][k],b=BT[m]&&BT[m][k],s=stats(m,x);if(!f)return`<tr><td>${hl(x)}<td colspan=15>–`;const d=dirOf(f);
  return`<tr><td>${hl(x)}<td class=${d[1]}>${d[0]}<td>${pct(f)}<td>${f.tg.toFixed(0)}<td>${f.lo.toFixed(0)}–${f.hi.toFixed(0)}<td>${pc(f.pu)}<td>${pc(f.pd)}<td>${pc(f.pf)}<td>${b?b.n:'–'}<td>${b&&b.n>=30?((1-b.b/b.bb)*100).toFixed(1)+'%':'–'}<td>${b&&b.n>=30?pc(b.acc):'–'}<td>${s?s.n:0}<td>${s?pc(s.acc):'–'}<td>${s?s.br.toFixed(3):'–'}<td>${s?pc(s.cov):'–'}<td>${flag(m,k)}`}).join('')+'</table><small>Horyzonty ≥ ~9 lat (3333d, 5222d) i 1144d+ nie mają wystarczającej historii do walk-forward – oceniane dopiero po dojrzeniu. 12h backtestowane na proxy 1d.</small></div>';
 const s=stats(m);h+=`<div class=box><b>Skuteczność live (wszystkie horyzonty)</b>: ${s?`n=${s.n}, trafność ${pc(s.acc)}, Brier ${s.br.toFixed(4)}, MAE ${s.mae.toFixed(2)} pp, pokrycie 80% = ${pc(s.cov)}, śr. P(wzrost) ${pc(s.pu)} vs faktyczna częstość ${pc(s.fu)}${s.n>=60&&s.rec>s.br*1.2?' <span class=warn>⚠ ostatnie 30 ocen gorsze o >20% – możliwa utrata skuteczności</span>':''}`:'brak ocenionych prognoz (pierwsze wyniki po 12h)'}</div>`;
 h+=`<div class=box><b>Wersje i uczenie</b><br>${S.versions.map(v=>`v${v.ver} g=${v.cfg.g} f=${v.cfg.f} – ${lt(v.t)} – ${v.why}`).join('<br>')}</div>`;
 h+=`<div class="box sc"><b>Historia prognoz (ostatnie 20, nigdy nie nadpisywane)</b><table><tr><th>Czas<th>Hor.<th>Cena<th>Cel<th>Kierunek<th>Wynik</tr>`+FC.filter(f=>f.m==m).slice(-20).reverse().map(f=>{const r=RES.find(q=>q.k==f.k),d=dirOf(f);return`<tr><td>${lt(f.t)}<td>${hl(f.h)}<td>${f.P0.toFixed(0)}<td>${f.tg.toFixed(0)}<td class=${d[1]}>${d[0]}<td>${r?`${((Math.exp(r.r)-1)*100).toFixed(2)}% ${r.hit?'✔':'✘'}`:'oczekuje'}`}).join('')+'</table></div>';
 return h}
function rCmp(){let h='<h2>Porównanie 13 systemów</h2><div class="box sc"><table><tr><th>Model'+H.map(x=>`<th>${hl(x)}`).join('')+'</tr>';
 M.forEach((x,m)=>{h+=`<tr><td>${m+1}. ${x[0]}`+H.map((_,k)=>{const f=LF[m][k];if(!f)return'<td>–';const d=dirOf(f);return`<td class=${d[1]}>${d[0][0]} ${pct(f)}`}).join('')});
 h+='<tr><td><b>Rozbieżność</b>'+H.map((_,k)=>{let u=0,d=0;for(let m=0;m<13;m++){const f=LF[m][k];if(!f)continue;const x=dirOf(f)[1];if(x=='up')u++;if(x=='dn')d++}return`<td class=${u&&d?'warn':''}>${u&&d?`⚠ ${u}↑/${d}↓`:`${u}↑/${d}↓`}`}).join('')+'</table><small>▲ wzrost ▼ spadek ■ stagnacja. Nie pokazuję średniej prognoz – liczba modeli nie oznacza większej wiarygodności; sprzeczne kierunki są oznaczone ⚠.</small></div>';
 h+='<div class="box sc"><b>Skuteczność live i walk-forward (horyzont wybrany: '+hl(H[HS])+')</b> <select onchange="HS=+this.value;render()">'+H.map((x,i)=>`<option value=${i} ${i==HS?'selected':''}>${hl(x)}</option>`).join('')+'</select><table><tr><th>Model<th>WF n<th>WF Brier-skill vs baseline<th>Live n<th>Live trafność<th>Live Brier<th>Status</tr>'+M.map((x,m)=>{const b=BT[m]&&BT[m][HS],s=stats(m,H[HS]);return`<tr><td>${m+1}. ${x[0]}<td>${b?b.n:'–'}<td>${b&&b.n>=30?((1-b.b/b.bb)*100).toFixed(1)+'%':'–'}<td>${s?s.n:0}<td>${s?pc(s.acc):'–'}<td>${s?s.br.toFixed(3):'–'}<td>${flag(m,HS)}`}).join('')+'</table></div>';return h}
const IND=[['MVRV, MVRV Z-Score, Realized Price, NUPL','NIEDOSTĘPNE','płatne (Glassnode/CryptoQuant)'],['LTH/STH-SOPR, HODL Waves, Net Position Change LTH','NIEDOSTĘPNE','płatne'],['Exchange Netflow, rezerwy giełdowe','NIEDOSTĘPNE','płatne'],['Puell Multiple','dostępny (liczony)','blockchain.info: miners-revenue'],['Aktywne adresy, wolumen transferów','dostępne (z-score 90d)','blockchain.info'],['Liczba transakcji, hash rate','dostępne w API (nieużyte w modelach)','blockchain.info'],['Arkusz zleceń, spread','dostępne (live)','Binance spot'],['Funding rate, open interest, baza','dostępne (live)','Binance Futures (może być blokowane regionalnie)'],['Likwidacje','NIEDOSTĘPNE','brak publicznego REST z historią'],['DXY, stopy, płynność, przepływy ETF','NIEDOSTĘPNE w tej wersji','brak darmowego API z CORS']];
function rLab(){const ok=v=>v?'<span class=up>OK</span>':'<span class=dn>brak</span>';
 let h=`<h2>Status i Lab</h2><div class=box>Źródła (ostatni cykl): Binance spot ${ok(SRC.spot)} · arkusz ${ok(SRC.depth)} · futures ${ok(SRC.fut)} · blockchain.info ${ok(SRC.chain)}<br>Ostatni cykl: ${CYC?lt(CYC):'–'} · następny: ${CYC?lt(CYC+CYCLE):'–'} · prognoz w bazie: ${FC.length} · ocen: ${RES.length}<br><button onclick="runCycle()">Uruchom cykl teraz</button> <button onclick="expo()">Eksport kopii (JSON)</button> <label class=mu>Import: <input type=file accept=.json onchange="impo(this.files[0])"></label> <button onclick="tests()">Uruchom testy</button></div><div id=tr class=box style="display:none"></div>`;
 h+='<div class="box sc"><b>Wskaźniki</b><table><tr><th>Wskaźnik<th>Status<th>Źródło</tr>'+IND.map(r=>`<tr><td>${r[0]}<td>${r[1]}<td>${r[2]}`).join('')+'</table></div>';
 h+=`<div class=box><b>Ograniczenia (uczciwie)</b><br>• Cały system działa w Twojej przeglądarce (GitHub Pages = brak backendu). Cykle i zapis dzieją się tylko, gdy strona jest otwarta; przy zamknięciu karty cykle są pomijane (zapisywane jako opóźnienie).<br>• Dane w IndexedDB tej przeglądarki – rób eksport kopii.<br>• Cykl = co 24 min (pełny zapis prognoz 13 modeli × 14 horyzontów: ${H.map(hl).join(', ')}); trening/selekcja co 12h z rejestrem punktów danych.<br>• Wykresy odświeżają się co minutę, ale prognoz nie przeliczają.</div>`;

 else R.push(['test wycieku wymaga załadowanych danych (uruchom cykl)',false]);
 try{await put('models',{k:'_test',v:1});await put('models',{k:'_test2',v:2});await put('models',{k:'_test',v:9});const r1=await get('models','_test'),r2=await get('models','_test2');T('zapis/odczyt i izolacja rekordów modeli',r1.v==9&&r2.v==2);await del('models','_test');await del('models','_test2')}catch(e){T('IndexedDB',0)}
 const c0=JSON.stringify(MS[1].cfg),sv=MS[0].cfg;MS[0].cfg={g:9,f:.9};T('zmiana parametrów modelu 1 nie zmienia modelu 2',JSON.stringify(MS[1].cfg)==c0);MS[0].cfg=sv;

(async()=>{try{const ms=await all('models');MS=M.map((_,m)=>ms.find(r=>r.k=='m'+m)||{k:'m'+m,ver:1,cfg:{...DEF},versions:[{ver:1,cfg:{...DEF},t:Date.now(),why:'start'}],dep:0});
 FC=(await all('fc')).sort((a,b)=>a.t-b.t);RES=await all('res');LOGS=(await all('log')).sort((a,b)=>b.t-a.t);LASTTR=Math.max(0,...LOGS.filter(l=>l.k[0]=='t').map(l=>l.t));
